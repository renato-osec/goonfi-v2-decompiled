[package]
name = "goonfi-v2"
version = "0.1.0"
edition = "2021"

[dependencies]
goonfi-common = { path = "programs/common" }
goonfi-account-validation = { path = "crates/goonfi-account-validation" }
oracle-asm = { path = "crates/oracle-asm" }
pinocchio = "=0.9.2"
pinocchio-system = "=0.3.0"
pinocchio-token = "=0.4.0"
pinocchio-token-2022 = "=0.1.0"
pinocchio-log = { version = "=0.4.0", default-features = false, features = ["macro"] }
borsh = "=0.10.4"
bytemuck = { version = "=1.25.2", features = ["min_const_generics"] }
solana-program = "=2.1.0"
spl-token-2022 = { version = "=7.0.0", features = ["no-entrypoint"] }
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }

# Constrain Solana's transitive graph for platform-tools v1.48.
# SPL Pod 0.5.0 and 0.5.1 link the same observed code; retain the tested patch.
spl-pod = "=0.5.0"
blake3 = "=1.5.5"
indexmap = "=2.13.1"
serde_with = { version = "=3.17.0", default-features = false }
zeroize = "=1.8.2"

# Keep proc-macro dependencies readable by platform-tools v1.48's Cargo.
[build-dependencies]
toml_datetime = "=1.0.1"
toml_edit = { version = "=0.25.5", default-features = false }
toml_parser = "=1.0.10"
zeroize_derive = "=1.4.3"

[lib]
name = "goonfi_v2"
crate-type = ["cdylib", "rlib"]
path = "programs/goonfi-v2/src/lib.rs"

[profile.release]
panic = "abort"
overflow-checks = true

[profile.release.package.tiny-keccak]
codegen-units = 1

[workspace]
